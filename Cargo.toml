[package]
name = "leet-code"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["merge-two-sorted-lists", "remove-duplicates-from-sorted-array","remove-element", "reverse-lined-list", "valid-parentheses"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.13", features = ["json"] }
scraper = "0.27.0"
