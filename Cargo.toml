[package]
name = "leet-code"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["convert-binary-number-in-a-linked-list-to-integer","merge-two-sorted-lists", "middle-of-the-linked-list", "minimum-pair-removal-to-sort-array-i", "palindrome-linked-list", "remove-duplicates-from-sorted-array", "remove-duplicates-from-sorted-list","remove-element", "remove-linked-list-elements", "reverse-lined-list", "valid-parentheses"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.13", features = ["json"] }
scraper = "0.27.0"
